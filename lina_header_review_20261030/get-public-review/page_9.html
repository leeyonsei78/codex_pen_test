(function(user) {
    var vestPIN, config, options, serverURL, serverAPIURL;  
    naw({
        properties: {
            enableGlobalKey: false
        },
        library : {
            template : {
                gridX:{}
            },
            widget : { 
                filedownload : function(){ 
               }  
           } 
        },
        dataset : {         
            dsResult : {},    
            dsParam : {} 
        },
        ready : {
            bizcode : function() {
            },
            event : function() {
                // 이전버튼                
                $('#getBenepiaToken').on('click', function() {                    
                    user.fnTest();
                });            
            },
            activate : function() {
                user.fnSetInit();
            },
            complete : function() {
            },
            message : function(msgObj) {
            },
            hasNotMessage : function() {
            },
            close : function() {
                return true;
            }
        }
    },user)
})
({
    //*****************************************************************************************
    //* 기 능 : [GA모바일청약] 화면 이동 설정 값 및 Default Set
    //*****************************************************************************************
    fnSetInit : function() {
        //화면정보 체크
        // 테스트 용은 비활성화
        //if ( !onsite.gfnInitGP($self)) return;        
    },
    fnTest : function(){
        // 트랜젝션 처리
        var svcId      = "GAN701SVC_selectSingle";  //
        var inDs       = "";                      // 입력 데이타셋
        var outDs      = "dsResult=" + gvCignaParam;// 출력 데이타셋
    
        var callbackFunc = user.fnCallBack;
    
        var dsParam = {};
        
        dsParam["gaCd"] = gvUserId; // 설계사사번
        dsParam["custCoCd"] = '00XX'; // 고객사코드
        
        if($("#gaCd").val()!==""){
            dsParam["gaCd"] = $("#gaCd").val(); // 설계사사번    
        }
        
        if($('#custCoCd').val()!==""){
            dsParam["custCoCd"] = $('#custCoCd').val(); // 고객사코드
        }else{
            dsParam["custCoCd"] = "XXOO"; // 고객사코드
        }
        
        onsite.gfnTransaction ($self, svcId, "GAN701SVC", "selectSingle", inDs, outDs, dsParam, callbackFunc, "", "", "", true);
    },
    
    fnCallBack : function(sSvcID, nErrorCode, sErrorMsg) {

        if (nErrorCode < 0) {
            if (nErrorCode == -1) {
                return;
            } else { // nErrorCode(-9)
                onsite.gfnShowMessage(this);
                return;
            }                       
        } else {
            var bascMsg = "";
            var msgCd   = "";

            switch(sSvcID) {
                case "GAN701SVC_selectSingle":
                    
                    //onsite.trace("GAN701SVC_selectSingle 결과 : "+dsResult.getData(0, "resData"));
                    
                    gpCore.modalAlert({
                        message: "토큰값",
                        description: dsResult.getData(0, "tokenKey")
                    });
                    break;
            }
        }
    }           
});
